[tool.ruff]
target-version = "py312"
line-length = 100
# Third-party demo docs: keep verbatim (ruff would reformat the Python blocks inside the .md files).
extend-exclude = ["sample-docs"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: modern syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests do `from app.common import ...` without installing the project.
pythonpath = ["."]
